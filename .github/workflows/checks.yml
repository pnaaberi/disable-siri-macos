name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Zsh syntax and non-mutating CLI behavior
        run: ./tests/test-cli.sh
      - name: Test state capture, restoration, and array filtering
        run: ./tests/test-state-helpers.sh
      - name: Test Touch Bar backup, removal, and restore with stubbed macOS commands
        run: ./tests/test-touchbar-restore.sh
